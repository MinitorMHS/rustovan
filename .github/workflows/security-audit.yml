name: Rust dependency security audit

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Audit locked Rust dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Cargo.lock
        run: cargo audit --file Cargo.lock --deny warnings