name: Rust dependency security audit

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Audit locked Rust dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked --version 0.22.2

      # cargo-audit scans Cargo.lock without Cargo feature resolution. The
      # remaining exception is an unmaintained TOML parser pulled in only by
      # age's i18n procedural-macro/build tooling; default releases omit age.
      # Do not ignore cryptographic advisories: the age git pin is updated.
      - name: Audit locked dependencies for default releases
        run: cargo +stable audit --file Cargo.lock --ignore RUSTSEC-2026-0374 --deny warnings
