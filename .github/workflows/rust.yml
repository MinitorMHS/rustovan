name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check cross-check formatting
        run: cargo fmt --manifest-path tools/rust-ton-crosscheck/Cargo.toml -- --check

      - name: Run unit tests
        run: cargo test --locked

      - name: Run independent Rust TON address cross-check
        run: cargo run --manifest-path tools/rust-ton-crosscheck/Cargo.toml --release --locked

      - name: Run strict Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check CPU-only configuration
        run: cargo check --no-default-features --features cpu --locked

      - name: Check default configuration
        run: cargo check --locked

      - name: Build release executable
        run: cargo build --release --locked

  windows-arm64:
    name: Windows ARM64 release build
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust and ARM64 target
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Build Windows ARM64 release executable
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --locked

      - name: Check CPU-only configuration
        run: cargo check --no-default-features --features cpu --locked

      - name: Check default GPU configuration
        run: cargo check --locked

      - name: Build release executable
        run: cargo build --release --locked

  linux-arm64:
    name: Linux ARM64 build and tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --locked

      - name: Check CPU-only configuration
        run: cargo check --no-default-features --features cpu --locked

      - name: Check default GPU configuration
        run: cargo check --locked

      - name: Build release executable
        run: cargo build --release --locked

  linux-additional-targets:
    name: Linux cross-target build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            cargo_target: ARMV7_UNKNOWN_LINUX_GNUEABIHF
            linker: arm-linux-gnueabihf-gcc
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          - target: riscv64gc-unknown-linux-gnu
            cargo_target: RISCV64GC_UNKNOWN_LINUX_GNU
            linker: riscv64-linux-gnu-gcc
            packages: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu libc6-dev-riscv64-cross
          - target: x86_64-unknown-linux-musl
            cargo_target: X86_64_UNKNOWN_LINUX_MUSL
            linker: musl-gcc
            packages: musl-tools
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install target linker
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          echo "CARGO_TARGET_${{ matrix.cargo_target }}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
          case "${{ matrix.target }}" in
            armv7-unknown-linux-gnueabihf)
              echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              echo "AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar" >> "$GITHUB_ENV"
              ;;
            riscv64gc-unknown-linux-gnu)
              echo "CC_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "AR_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-ar" >> "$GITHUB_ENV"
              ;;
            x86_64-unknown-linux-musl)
              echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
              echo "AR_x86_64_unknown_linux_musl=ar" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install stable Rust and target
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release executable for Linux target
        run: cargo build --release --locked --target "${{ matrix.target }}" --features cross-openssl

  linux-arm64-musl:
    name: Linux ARM64 musl cross-target build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_musl=ar" >> "$GITHUB_ENV"

      - name: Install stable Rust and ARM64 musl target
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl

      - name: Build release executable for ARM64 musl
        run: cargo build --release --locked --target aarch64-unknown-linux-musl --features cross-openssl

  macos:
    name: macOS build and tests (Metal compile coverage)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenSSL build dependencies
        run: brew install openssl@3 pkg-config

      - name: Configure OpenSSL
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --locked

      - name: Check CPU-only configuration
        run: cargo check --no-default-features --features cpu --locked

      - name: Check macOS GPU configuration
        run: cargo check --locked

      - name: Build release executable with Metal support
        run: cargo build --release --locked

